name: 发布 Release 包

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建并上传的 Release 标签
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # The OneDrive client ID is a public SPA identifier. Keep it in a repository
  # variable (or secret for existing setups) so release builds retain the same
  # sign-in capability as local Web/Electron builds.
  VITE_ONEDRIVE_CLIENT_ID: ${{ vars.VITE_ONEDRIVE_CLIENT_ID || secrets.VITE_ONEDRIVE_CLIENT_ID }}
  VITE_ONEDRIVE_AUTHORITY: ${{ vars.VITE_ONEDRIVE_AUTHORITY || secrets.VITE_ONEDRIVE_AUTHORITY || 'https://login.microsoftonline.com/consumers/oauth2/v2.0' }}

jobs:
  validate:
    name: 发布前测试与构建
    if: startsWith(github.ref_name, 'v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出正式版源码
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行测试
        run: pnpm test

      - name: 生成生产构建
        run: pnpm build

  package-software:
    name: 生成软件包
    if: startsWith(github.ref_name, 'v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: 检出正式版源码
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: 组装软件包
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package_root="NPEE-Study-Space-v${version}"
          archive="${package_root}-Software.zip"
          mkdir -p "构建/release/${package_root}"
          rsync -a ./ "构建/release/${package_root}/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.pnpm-store/' \
            --exclude 'node_modules/' \
            --exclude '构建/' \
            --exclude '数据/' \
            --exclude '机械原理-教材习题/' \
            --exclude '数学真题题库-可访问数据.json' \
            --exclude '.DS_Store' \
            --exclude 'release/'
          cd 构建/release
          zip -1 -q -r "../../${archive}" "${package_root}"
          cd ../..
          sha256sum "${archive}" > "${archive}.sha256"
          printf 'RELEASE_ARCHIVE=%s\n' "${archive}" >> "$GITHUB_ENV"

      - name: 上传软件包到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE.sha256" --clobber

  package-question-bank:
    name: 生成题库数据包
    if: startsWith(github.ref_name, 'v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: 检出正式版题库数据
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: 组装题库数据包
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package_root="NPEE-Study-Space-v${version}"
          archive="${package_root}-Question-Bank.zip"
          mkdir -p "构建/release/${package_root}"
          rsync -a "数据/" "构建/release/${package_root}/数据/"
          cd 构建/release
          zip -1 -q -r "../../${archive}" "${package_root}/数据"
          cd ../..
          sha256sum "${archive}" > "${archive}.sha256"
          printf 'RELEASE_ARCHIVE=%s\n' "${archive}" >> "$GITHUB_ENV"

      - name: 上传题库数据包到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE.sha256" --clobber

  package-electron:
    name: 生成 ${{ matrix.platform }} 封装更新包
    if: startsWith(github.ref_name, 'v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出正式版源码
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 检查 macOS 签名与公证凭据
        if: matrix.platform == 'macOS'
        id: macos_credentials
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${MACOS_CSC_LINK//[[:space:]]/}" ]] || missing+=(MACOS_CSC_LINK)
          [[ -n "${MACOS_CSC_KEY_PASSWORD//[[:space:]]/}" ]] || missing+=(MACOS_CSC_KEY_PASSWORD)
          [[ -n "${APPLE_ID//[[:space:]]/}" ]] || missing+=(APPLE_ID)
          [[ -n "${APPLE_APP_SPECIFIC_PASSWORD//[[:space:]]/}" ]] || missing+=(APPLE_APP_SPECIFIC_PASSWORD)
          [[ -n "${APPLE_TEAM_ID//[[:space:]]/}" ]] || missing+=(APPLE_TEAM_ID)
          if (( ${#missing[@]} > 0 )); then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo "::warning::未配置完整的 macOS 发布凭据：${missing[*]}。本次将生成包含解除隔离脚本的未签名备用包；配置凭据后重新运行可生成正式签名包。"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo '已检测到完整的 macOS 签名与公证凭据，将生成正式签名包。'
          fi

      - name: 生成已签名 macOS 更新包
        if: matrix.platform == 'macOS' && steps.macos_credentials.outputs.available == 'true'
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm build
          pnpm exec electron-builder --publish never --arm64 -c.mac.forceCodeSigning=true

      - name: 生成未签名 macOS 备用包
        if: matrix.platform == 'macOS' && steps.macos_credentials.outputs.available != 'true'
        run: |
          pnpm build
          pnpm exec electron-builder --publish never --arm64

      - name: 生成 Windows 更新包
        if: matrix.platform == 'Windows'
        run: |
          pnpm build
          pnpm exec electron-builder --publish never

      - name: 验证 macOS 安装包
        if: matrix.platform == 'macOS'
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${MACOS_CSC_LINK//[[:space:]]/}" && -n "${MACOS_CSC_KEY_PASSWORD//[[:space:]]/}" && -n "${APPLE_ID//[[:space:]]/}" && -n "${APPLE_APP_SPECIFIC_PASSWORD//[[:space:]]/}" && -n "${APPLE_TEAM_ID//[[:space:]]/}" ]]; then
            app_path="$(find '构建/release/electron' -type d -name '*.app' -print)"
            if [[ -z "$app_path" ]]; then
              echo '未找到 macOS 应用包，无法验证签名' >&2
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "$app_path"
            spctl --assess --type execute --verbose=4 "$app_path"
          else
            dmg_path="$(find '构建/release/electron' -type f -name '*.dmg' -print)"
            if [[ -z "$dmg_path" ]]; then
              echo '未找到 macOS DMG 发布文件' >&2
              exit 1
            fi
            test -x 'macOS-解除隔离并启动.command'
            echo "未签名备用包已验证：${dmg_path}，且包含可执行的 macOS 解除隔离启动脚本。"
          fi

      - name: 上传 Electron 更新包到 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=()
          for file in 构建/release/electron/*; do
            if [[ -f "$file" ]]; then
              files+=("$file")
            fi
          done
          if (( ${#files[@]} == 0 )); then
            echo '未找到 Electron 发布文件' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
