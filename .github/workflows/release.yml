name: 发布 Release 包

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  validate:
    name: 发布前测试与构建
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出正式版源码
        uses: actions/checkout@v6

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行测试
        run: pnpm test

      - name: 生成生产构建
        run: pnpm build

  package-software:
    name: 生成软件包
    if: startsWith(github.ref_name, 'v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: 检出正式版源码
        uses: actions/checkout@v6

      - name: 组装软件包
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_root="NPEE-Study-Space-v${version}"
          archive="${package_root}-Software.zip"
          mkdir -p "构建/release/${package_root}"
          rsync -a ./ "构建/release/${package_root}/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.pnpm-store/' \
            --exclude 'node_modules/' \
            --exclude '构建/' \
            --exclude '数据/' \
            --exclude '机械原理-教材习题/' \
            --exclude '数学真题题库-可访问数据.json' \
            --exclude '.DS_Store' \
            --exclude 'release/'
          cd 构建/release
          zip -1 -q -r "../../${archive}" "${package_root}"
          cd ../..
          sha256sum "${archive}" > "${archive}.sha256"
          printf 'RELEASE_ARCHIVE=%s\n' "${archive}" >> "$GITHUB_ENV"

      - name: 上传软件包到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE.sha256" --clobber

  package-question-bank:
    name: 生成题库数据包
    if: startsWith(github.ref_name, 'v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: 检出正式版题库数据
        uses: actions/checkout@v6

      - name: 组装题库数据包
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_root="NPEE-Study-Space-v${version}"
          archive="${package_root}-Question-Bank.zip"
          mkdir -p "构建/release/${package_root}"
          rsync -a "数据/" "构建/release/${package_root}/数据/"
          cd 构建/release
          zip -1 -q -r "../../${archive}" "${package_root}/数据"
          cd ../..
          sha256sum "${archive}" > "${archive}.sha256"
          printf 'RELEASE_ARCHIVE=%s\n' "${archive}" >> "$GITHUB_ENV"

      - name: 上传题库数据包到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE.sha256" --clobber
